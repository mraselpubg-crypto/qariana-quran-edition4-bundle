<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes, viewport-fit=cover">
  <title>ক্বারীয়ানা কুরআন শরীফ — পৃষ্ঠা ভিউ</title>
  <link rel="stylesheet" href="reader.css">
  <style>
    /* অ্যান্ড্রয়েড সিস্টেম হাই-কনট্রাস্ট টেক্সট প্রতিরোধ ও ফন্ট সুরক্ষা */
    * {
      -webkit-text-stroke: 0 !important;
      text-shadow: none !important;
      font-synthesis: none !important;
      -webkit-font-smoothing: antialiased !important;
    }
    .kq-word, .kq-arabic-text, .cls-1, .cls-3, .cls-8, svg text, .kq-meaning-row, span, div, p {
      -webkit-text-stroke: 0 !important;
      text-shadow: none !important;
      font-synthesis: none !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-body, #0B1324);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: var(--font-bengali, 'Kalpurush', sans-serif);
    }
    #mushafScrollWrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      touch-action: pan-x pan-y pinch-zoom;
      box-sizing: border-box;
      padding: 0;
    }
    #mushafScrollWrap.is-fit-page {
      overflow: hidden;
      cursor: default;
    }
    #mushafCard {
      width: 100%;
      height: 100%;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: 100%;
      max-height: 100%;
      margin: 0 auto;
      border-radius: 0;
      overflow: hidden;
      will-change: transform;
      box-shadow: none;
      border: none;
      position: relative;
      transition: transform 0.12s ease-out;
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--classic-card-bg, transparent);
    }
    #mushafCard svg {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: 100% !important;
      max-height: 100% !important;
      display: block !important;
    }
    body.classic-mode #mushafCard {
      background: var(--classic-card-bg, #FFFFFF);
      border-radius: 0;
      box-shadow: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    body.classic-mode[data-theme="dark"] #mushafCard {
      background: #0B1324 !important;
    }
    body.classic-mode[data-theme="sepia"] #mushafCard {
      background: #FAF3E0 !important;
    }
    body.classic-mode[data-theme="emerald"] #mushafCard {
      background: #03221B !important;
    }
    body.classic-mode[data-theme="midnight"] #mushafCard {
      background: #111633 !important;
    }
    body.classic-mode[data-theme="cream"] #mushafCard {
      background: #FFFDF5 !important;
    }
    body.classic-mode[data-theme="light"] #mushafCard {
      background: #FFFFFF !important;
    }

    /* ক্লাসিক মোডে ডার্ক থিম ও সব থিমে আরবি ও বাংলা ফন্ট নিখুঁতভাবে ফুটিয়ে তোলা */
    body[data-theme="dark"] .kq-svg-arabic-base,
    .kq-theme-dark .kq-svg-arabic-base {
      fill: var(--classic-arabic-color, #F59E0B) !important;
    }
    body[data-theme="dark"] .kq-svg-tajweed-signs,
    .kq-theme-dark .kq-svg-tajweed-signs {
      fill: var(--classic-tajweed-color, #FDE68A) !important;
    }
    body[data-theme="dark"] .kq-svg-bengali-meaning,
    .kq-theme-dark .kq-svg-bengali-meaning {
      fill: var(--classic-trans-color, #E2E8F0) !important;
    }
    body[data-theme="dark"] .kq-svg-page-notes,
    .kq-theme-dark .kq-svg-page-notes {
      fill: var(--classic-notes-color, #D97706) !important;
    }
    body[data-theme="dark"] .kq-svg-ayah-bg,
    .kq-theme-dark .kq-svg-ayah-bg {
      fill: #1E293B !important;
    }

    body[data-theme="sepia"] .kq-svg-arabic-base,
    .kq-theme-sepia .kq-svg-arabic-base {
      fill: #451A03 !important;
    }
    body[data-theme="sepia"] .kq-svg-bengali-meaning,
    .kq-theme-sepia .kq-svg-bengali-meaning {
      fill: #573016 !important;
    }
    body[data-theme="sepia"] .kq-svg-ayah-bg,
    .kq-theme-sepia .kq-svg-ayah-bg {
      fill: #EDE3CD !important;
    }

    body[data-theme="emerald"] .kq-svg-arabic-base,
    .kq-theme-emerald .kq-svg-arabic-base {
      fill: #FEF3C7 !important;
    }
    body[data-theme="emerald"] .kq-svg-bengali-meaning,
    .kq-theme-emerald .kq-svg-bengali-meaning {
      fill: #ECFDF5 !important;
    }
    body[data-theme="emerald"] .kq-svg-ayah-bg,
    .kq-theme-emerald .kq-svg-ayah-bg {
      fill: #064E3B !important;
    }

    body[data-theme="light"] .kq-svg-arabic-base,
    .kq-theme-light .kq-svg-arabic-base {
      fill: #000000 !important;
    }
    body[data-theme="light"] .kq-svg-bengali-meaning,
    .kq-theme-light .kq-svg-bengali-meaning {
      fill: #111827 !important;
    }

    body.classic-mode.has-custom-page-bg #mushafCard {
      background: var(--custom-page-bg, #FFFFFF) !important;
    }

    /* বাংলা অর্থ দেখানো / লুকানো রুল */
    .kq-hide-meaning .kq-svg-bengali-meaning,
    .kq-classic-vector-svg.kq-hide-meaning .kq-svg-bengali-meaning,
    #mushafCard.kq-hide-meaning .kq-svg-bengali-meaning,
    body.kq-classic-hide-meaning .kq-svg-bengali-meaning {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }

    /* ক্লাসিক ভেক্টর এসভিজি থিম স্টাইল */
    .kq-classic-vector-svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: auto;
      shape-rendering: geometricPrecision;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      image-rendering: -webkit-optimize-contrast;
    }
    .kq-classic-vector-svg text,
    .kq-classic-vector-svg use,
    .kq-classic-vector-svg path {
      shape-rendering: geometricPrecision;
      text-rendering: optimizeLegibility;
    }

    body[data-theme="dark"] .kq-classic-vector-svg .kq-svg-ayah-bg { fill: #1E293B !important; }
    body[data-theme="dark"] .kq-classic-vector-svg .kq-svg-arabic-base { fill: var(--ortho-arabic-color, #FEF3C7) !important; }
    body[data-theme="dark"] .kq-classic-vector-svg .kq-svg-tajweed-signs { fill: #FDE68A !important; }
    body[data-theme="dark"] .kq-classic-vector-svg .kq-svg-bengali-meaning { fill: var(--ortho-trans-color, #CBD5E1) !important; }
    body[data-theme="dark"] .kq-classic-vector-svg .kq-svg-page-notes { fill: #D97706 !important; }
    body[data-theme="dark"] .kq-classic-vector-svg use[fill="#231f20"],
    body[data-theme="dark"] .kq-classic-vector-svg path[fill="#231f20"] { fill: #FEF3C7 !important; }
    body[data-theme="dark"] .kq-classic-vector-svg path[stroke="#231f20"] { stroke: #FEF3C7 !important; }

    body[data-theme="sepia"] .kq-classic-vector-svg .kq-svg-ayah-bg { fill: #EDE3CD !important; }
    body[data-theme="sepia"] .kq-classic-vector-svg .kq-svg-arabic-base { fill: #381E0D !important; }
    body[data-theme="sepia"] .kq-classic-vector-svg .kq-svg-tajweed-signs { fill: #78350F !important; }
    body[data-theme="sepia"] .kq-classic-vector-svg .kq-svg-bengali-meaning { fill: #573016 !important; }
    body[data-theme="sepia"] .kq-classic-vector-svg .kq-svg-page-notes { fill: #92400E !important; }
    body[data-theme="sepia"] .kq-classic-vector-svg use[fill="#231f20"],
    body[data-theme="sepia"] .kq-classic-vector-svg path[fill="#231f20"] { fill: #381E0D !important; }

    body[data-theme="emerald"] .kq-classic-vector-svg .kq-svg-ayah-bg { fill: #064E3B !important; }
    body[data-theme="emerald"] .kq-classic-vector-svg .kq-svg-arabic-base { fill: #ECFDF5 !important; }
    body[data-theme="emerald"] .kq-classic-vector-svg .kq-svg-tajweed-signs { fill: #A7F3D0 !important; }
    body[data-theme="emerald"] .kq-classic-vector-svg .kq-svg-bengali-meaning { fill: #D1FAE5 !important; }
    body[data-theme="emerald"] .kq-classic-vector-svg use[fill="#231f20"],
    body[data-theme="emerald"] .kq-classic-vector-svg path[fill="#231f20"] { fill: #ECFDF5 !important; }

    body[data-theme="midnight"] .kq-classic-vector-svg .kq-svg-ayah-bg { fill: #1E1B4B !important; }
    body[data-theme="midnight"] .kq-classic-vector-svg .kq-svg-arabic-base { fill: #FDE68A !important; }
    body[data-theme="midnight"] .kq-classic-vector-svg .kq-svg-tajweed-signs { fill: #FEF08A !important; }
    body[data-theme="midnight"] .kq-classic-vector-svg .kq-svg-bengali-meaning { fill: #E0E7FF !important; }
    body[data-theme="midnight"] .kq-classic-vector-svg use[fill="#231f20"],
    body[data-theme="midnight"] .kq-classic-vector-svg path[fill="#231f20"] { fill: #FDE68A !important; }

    body[data-theme="cream"] .kq-classic-vector-svg .kq-svg-ayah-bg { fill: #FEF9C3 !important; }
    body[data-theme="cream"] .kq-classic-vector-svg .kq-svg-arabic-base { fill: #064E3B !important; }
    body[data-theme="cream"] .kq-classic-vector-svg .kq-svg-bengali-meaning { fill: #1C1917 !important; }
    body[data-theme="cream"] .kq-classic-vector-svg use[fill="#231f20"],
    body[data-theme="cream"] .kq-classic-vector-svg path[fill="#231f20"] { fill: #064E3B !important; }

    body[data-theme="light"] .kq-classic-vector-svg .kq-svg-ayah-bg { fill: #D0E8C4 !important; }
    body[data-theme="light"] .kq-classic-vector-svg .kq-svg-arabic-base { fill: #000000 !important; }
    body[data-theme="light"] .kq-classic-vector-svg .kq-svg-bengali-meaning { fill: #0F172A !important; }
    body[data-theme="light"] .kq-classic-vector-svg use[fill="#231f20"],
    body[data-theme="light"] .kq-classic-vector-svg path[fill="#231f20"] { fill: #000000 !important; }

    #mushafCard svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* থিম অনুযায়ী আরবি আয়াত রো ব্যাকগ্রাউন্ড (.cls-3) — লাইট মোডে মূল প্রিন্টের সাদা রঙ অক্ষুণ্ন থাকবে */
    body[data-theme="light"] #mushafCard svg .cls-3 {
      fill: #FFFFFF !important;
    }
    body[data-theme="dark"] #mushafCard svg .cls-3 {
      fill: #0F1A2E !important;
    }
    body[data-theme="midnight"] #mushafCard svg .cls-3 {
      fill: #161C40 !important;
    }
    body[data-theme="emerald"] #mushafCard svg .cls-3 {
      fill: #052E24 !important;
    }
    body[data-theme="sepia"] #mushafCard svg .cls-3 {
      fill: #FDF8EC !important;
    }
    body[data-theme="cream"] #mushafCard svg .cls-3 {
      fill: #FFFDF7 !important;
    }

    /* বাংলা অর্থ লুকানো থাকলে পুরো ফ্রেম জুড়ে আরবি বক্সের জন্য স্টাইল */
    .kq-ortho-arabic-box.full-width {
      padding: 8px 12px 0 12px !important;
      text-align: center !important;
      text-align-last: center !important;
      word-spacing: normal !important;
    }

    /* পপওভার স্টাইল */
    .kq-word-popover {
      position: fixed;
      background: #111827;
      border: 1.5px solid #F59E0B;
      border-radius: 14px;
      padding: 12px 14px;
      z-index: 99999;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      min-width: 240px;
      max-width: 310px;
      color: #E2E8F0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: popIn 0.16s ease-out;
      touch-action: auto;
    }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .kq-popover-word-title {
      font-family: 'AASaddamQuran', serif;
      font-size: 26px;
      line-height: 1.4;
      text-align: center;
      direction: rtl;
      color: #FEF3C7;
      border-bottom: 1px solid rgba(245, 158, 11, 0.25);
      padding-bottom: 4px;
    }
    .kq-popover-meta {
      font-size: 11.5px;
      line-height: 1.4;
      color: #CBD5E1;
    }
    .kq-popover-meta strong {
      color: #F59E0B;
    }
    .kq-popover-tajweed-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid;
      background: rgba(15, 23, 42, 0.7);
      font-size: 11px;
    }
    .kq-popover-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid rgba(148, 163, 184, 0.15);
    }
    .kq-popover-btn {
      background: rgba(245, 158, 11, 0.15);
      color: #F59E0B;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .kq-popover-colors {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .kq-color-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    .dot-yellow { background: #EAB308; }
    .dot-green  { background: #10B981; }
    .dot-blue   { background: #38BDF8; }
    .dot-coral  { background: #F43F5E; }
    .dot-clear  { background: transparent; color: #94A3B8; border-color: #64748B; }
  </style>

<style>

    /* --- Native Compose Shimmer takes priority; HTML overlay suppressed --- */
    #kq-loader {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #kq-loader.kq-hide {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
    #kq-loader svg {
      position: relative; width: min(60vmin, 330px); height: auto;
      filter: drop-shadow(0 12px 30px rgba(0,0,0,0.55));
    }
    .kq-text {
      position: relative;
      font-family: 'Kalpurush', system-ui, sans-serif;
      font-size: clamp(15px, 3vmin, 20px);
      font-weight: 600;
      color: #fff6c9;
      letter-spacing: 0.02em;
      display: flex; gap: 0.3em; align-items: baseline;
    }
    .kq-dots i {
      display: inline-block; width: 0.32em; height: 0.32em; margin-left: 0.22em;
      border-radius: 50%; background: #f6d86b; animation: kqdot 1.2s ease-in-out infinite;
    }
    .kq-dots i:nth-child(2) { animation-delay: 0.18s; }
    .kq-dots i:nth-child(3) { animation-delay: 0.36s; }
    @keyframes kqdot {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-0.35em); opacity: 1; }
    }
    .kq-bar {
      position: relative; width: min(44vmin, 220px); height: 4.5px; border-radius: 5px;
      background: rgba(255, 255, 255, 0.16); overflow: hidden;
    }
    .kq-bar::after {
      content: ""; position: absolute; inset: 0; width: 40%; border-radius: 5px;
      background: linear-gradient(90deg, transparent, #f6d86b, #fff6a8);
      animation: kqbar 1.5s ease-in-out infinite;
    }
    @keyframes kqbar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
    
</style>
</head>
<body data-theme="dark" oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">
<div id="kq-loader" role="status" aria-live="polite" aria-label="লোড হচ্ছে">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-label="কারিয়ানা কুরআন শিক্ষা সোসাইটি">
<style>
 .cov,.pg,.flip,.badge,.rays,.spin,.spin2,.glow,.quran,.shine{transform-box:view-box}
 .cov,.pg,.flip,.badge{transform-origin:0 0}
 .cov{animation:cov 6s cubic-bezier(.5,0,.2,1) infinite}
 .pg{animation:pg 6s cubic-bezier(.5,0,.2,1) infinite}
 .flip{animation:flip 6s ease-in-out infinite;opacity:0}
 .rays{transform-origin:500px 330px;animation:spin 40s linear infinite}
 .spin{transform-origin:500px 500px;animation:spin 3s linear infinite}
 .spin2{transform-origin:500px 500px;animation:spin 3s linear infinite reverse}
 .glow{animation:glow 3s ease-in-out infinite}
 .quran{animation:bob 3s ease-in-out infinite}
 .badge{animation:pulse 3s ease-in-out infinite}
 .b2{animation-delay:1s}.b3{animation-delay:2s}
 .shine{animation:shine 3s ease-in-out infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 @keyframes cov{0%,6%{transform:scaleX(.2)}22%{transform:scaleX(1.03)}27%{transform:scaleX(1)}80%{transform:scaleX(1)}94%{transform:scaleX(.2)}100%{transform:scaleX(.2)}}
 @keyframes pg{0%,8%{transform:scaleX(.2);opacity:0}15%{opacity:1}24%{transform:scaleX(1.02)}28%{transform:scaleX(1)}78%{transform:scaleX(1);opacity:1}88%{transform:scaleX(.2);opacity:0}100%{transform:scaleX(.2);opacity:0}}
 @keyframes flip{0%,31%{opacity:0;transform:scaleX(1)}32%{opacity:1;transform:scaleX(1)}38%{transform:scaleX(0)}44%{transform:scaleX(-1);opacity:1}45%{opacity:0}54%{opacity:0;transform:scaleX(1)}55%{opacity:1;transform:scaleX(1)}61%{transform:scaleX(0)}67%{transform:scaleX(-1);opacity:1}68%{opacity:0}100%{opacity:0}}
 @keyframes glow{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:.95;transform:scale(1.06)}}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
 @keyframes pulse{0%,100%{transform:scale(1)}12%{transform:scale(1.12)}30%{transform:scale(1)}}
 @keyframes shine{0%,15%{transform:skewX(-18deg) translateX(0)}60%,100%{transform:skewX(-18deg) translateX(520px)}}
 @media (prefers-reduced-motion:reduce){*{animation:none!important}.pg{opacity:1}}
</style>

></g><g transform="translate(80 500)"><g class="badge "><circle r="66" fill="#fff" stroke="#0e6f62" stroke-width="3"/><path d="M20,-36 L20,2 Q20,22 -2,22 L-22,22 Q-36,22 -36,8" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/></g></g><g transform="translate(920 500)"><g class="badge b2"><circle r="66" fill="#fff" stroke="#0e6f62" stroke-width="3"/><path d="M-7,-40 Q8,-44 12,-30 L7,40 Q0,44 -4,38 L-1,-12 Q-3,-24 -7,-28 Z" fill="#111"/></g></g><g transform="translate(500 920)"><g class="badge b3"><circle r="66" fill="#fff" stroke="#0e6f62" stroke-width="3"/><path d="M26,-14 L26,-34 L-18,-34 L-18,36" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"/></g></g><circle class="spin" cx="500" cy="500" r="352" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-dasharray="300 1912"/><circle class="spin2" cx="500" cy="500" r="352" fill="none" stroke="#f6d86b" stroke-width="7" stroke-linecap="round" stroke-dasharray="120 2092" opacity=".9"/></svg>
  <div class="kq-bar"></div>
  <div class="kq-text"><span>লোড হচ্ছে</span><span class="kq-dots"><i></i><i></i><i></i></span></div>
</div>

  <div id="mushafScrollWrap" class="kq-mushaf-scroll-wrap is-fit-page" oncontextmenu="return false;">
    <div id="mushafCard" class="kq-mushaf-card"></div>
  </div>

  <div id="kqWordPopover" class="kq-word-popover" style="display:none;"></div>

  <script>

      function hideKqLoader() {
        try {
          var l = document.getElementById('kq-loader');
          if (l) {
            l.classList.add('kq-hide');
            setTimeout(function() { if (l.classList.contains('kq-hide')) l.style.display = 'none'; }, 450);
          }
        } catch(e) {}
      }
      function showKqLoader() {
        // Native Compose shimmer is displayed; HTML loader suppressed
        try {
          var l = document.getElementById('kq-loader');
          if (l) l.style.display = 'none';
        } catch(e) {}
      }
    

    (function () {
      'use strict';

      // ৯টি রো-এর অপরিবর্তনীয় নিখুঁত জ্যামিতিক উচ্চতা ও অবস্থান
      const ROW_GEOMETRY = [
        { ly: 118.95, lh: 63.32, sy: 118.95, sh: 15.93, ay: 135.13, ah: 45.70 },
        { ly: 182.52, lh: 63.32, sy: 181.09, sh: 15.93, ay: 197.27, ah: 45.70 },
        { ly: 246.09, lh: 63.32, sy: 243.22, sh: 15.93, ay: 259.40, ah: 45.70 },
        { ly: 309.67, lh: 63.32, sy: 305.36, sh: 15.93, ay: 321.54, ah: 45.70 },
        { ly: 373.24, lh: 63.32, sy: 367.49, sh: 15.93, ay: 383.67, ah: 45.70 },
        { ly: 436.81, lh: 63.32, sy: 429.62, sh: 15.93, ay: 445.81, ah: 45.70 },
        { ly: 500.38, lh: 63.32, sy: 491.76, sh: 15.93, ay: 507.94, ah: 45.70 },
        { ly: 553.89, lh: 61.88, sy: 553.89, sh: 15.93, ay: 570.07, ah: 45.70 },
        { ly: 616.03, lh: 61.88, sy: 616.03, sh: 15.93, ay: 632.21, ah: 45.70 }
      ];

      const THEME_ORTHO_DEFAULTS = {
        dark:     { bg: '#0B1324', arabic: '#FEF3C7', meaning: '#E2E8F0' },
        light:    { bg: '#FFFFFF', arabic: '#000000', meaning: '#111827' },
        sepia:    { bg: '#FAF3E0', arabic: '#261408', meaning: '#2D1E12' },
        emerald:  { bg: '#03221B', arabic: '#FEF3C7', meaning: '#ECFDF5' },
        midnight: { bg: '#111633', arabic: '#FDE68A', meaning: '#E0E7FF' },
        cream:    { bg: '#FFFDF5', arabic: '#064E3B', meaning: '#1C1917' }
      };

      const BN_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
      function toBanglaNum(num) {
        return String(num).replace(/[0-9]/g, d => BN_DIGITS[parseInt(d, 10)] || d);
      }

      // তাৎক্ষণিকভাবে অ্যান্ড্রয়েড ব্রিজ থেকে কনফিগ সংগ্রহ যাতে অন্য সংস্করণের এসভিজি ফ্ল্যাশ না করে
      let initConfig = null;
      if (window.AndroidBridge && typeof window.AndroidBridge.getInitConfig === 'function') {
        try {
          const cfgStr = window.AndroidBridge.getInitConfig();
          if (cfgStr) initConfig = JSON.parse(cfgStr);
        } catch (e) {}
      }

      let isClassicMode = initConfig && typeof initConfig.isClassic === 'boolean' ? initConfig.isClassic : false;
      let cropMargins = initConfig && typeof initConfig.cropMargins === 'boolean' ? initConfig.cropMargins : true;
      let showMeaning = initConfig && typeof initConfig.showMeaning === 'boolean' ? initConfig.showMeaning : true;
      let currentClassicPage = initConfig && initConfig.pageNum ? Math.max(1, initConfig.pageNum) : 1;
      let currentTheme = initConfig && initConfig.themeId ? initConfig.themeId : 'dark';
      document.documentElement.dataset.theme = currentTheme;
      document.body.dataset.theme = currentTheme;
      document.body.classList.remove('kq-theme-dark', 'kq-theme-light', 'kq-theme-sepia', 'kq-theme-emerald', 'kq-theme-midnight', 'kq-theme-cream');
      document.body.classList.add(`kq-theme-${currentTheme}`);
      (function applyBootThemeVars() {
        const bootDef = THEME_ORTHO_DEFAULTS[currentTheme] || THEME_ORTHO_DEFAULTS.light;
        const cAr = initConfig && (initConfig.customAr || initConfig.customArabic) ? (initConfig.customAr || initConfig.customArabic) : bootDef.arabic;
        const cBn = initConfig && (initConfig.customBn || initConfig.customBangla) ? (initConfig.customBn || initConfig.customBangla) : bootDef.meaning;
        const cBg = initConfig && initConfig.customBg ? initConfig.customBg : bootDef.bg;
        document.documentElement.style.setProperty('--ortho-arabic-color', cAr);
        document.documentElement.style.setProperty('--ortho-trans-color', cBn);
        document.documentElement.style.setProperty('--bg-body', cBg);
        document.documentElement.style.setProperty('--classic-card-bg', cBg);
      })();

      function applyMushafSvgFit(svgEl) {
        if (!svgEl) return;
        if (isClassicMode) {
          svgEl.setAttribute('viewBox', cropMargins ? '88 108 406 620' : '0 0 595.276 841.89');
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
          return;
        }
        if (cropMargins !== false) {
          svgEl.setAttribute('viewBox', '18 10 506 700');
        } else {
          svgEl.setAttribute('viewBox', '0 0 542.25 720.15');
        }
        svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
      }
      window.addEventListener('resize', () => {
        const c = document.getElementById('mushafCard');
        if (c) applyMushafSvgFit(c.querySelector('svg'));
      });

      if (isClassicMode) {
        document.body.classList.add('classic-mode');
      } else {
        document.body.classList.remove('classic-mode');
      }

      let svgTemplateBase = null;
      let svgTemplateBaseWithMeaning = null;
      let svgTemplateBaseWithoutMeaning = null;
      let currentPageData = null;
      let wordMarks = {};
      let activeBookmark = null;
      let pageZoom = 100;
      let selectedWordEl = null;

      // টাচ / সোয়াইপ হ্যান্ডলিং
      let touchStartX = 0;
      let touchStartY = 0;
      let touchLastX = 0;
      let touchLastY = 0;
      let touchMoved = false;
      let lastTapTime = 0;
      let isDragging = false;
      let tapDebounceTimer = null;

      function createMushafTemplateNoMeaning(base) {
        let tmpl = base;
        // ১. বাংলা অর্থের ব্যাকগ্রাউন্ড রেক্ট্যাঙ্গেল বাদ দেওয়া
        tmpl = tmpl.replace(/<rect[^>]+class="cls-(?:7|11)"[^>]*\/>/g, '');
        // ২. বাংলা অর্থের চারপাশের বর্ডার পাথগুলো বাদ দেওয়া
        tmpl = tmpl.replace(/<path[^>]+class="cls-8"[^>]+d="M198\.[0-9]+[^"]*"[^>]*\/>/g, '');
        // ৩. আরবি তাজবীদ স্ট্রিপ ও মূল আরবি রো পুরো প্রস্থে প্রসারিত করা
        tmpl = tmpl.replace(/<rect class="(cls-[13])" x="198\.(?:62|59)" (y="[^"]+") width="290\.35" (height="[^"]+")\/>/g,
          '<rect class="$1" x="56.15" $2 width="432.82" $3/>');
        // ৪. আরবির গ্রিড লাইন পুরো পেজের প্রস্থে (432.82pt) প্রসারিত করা
        tmpl = tmpl.replace(/M488\.[0-9]+,([0-9\.]+)v([0-9\.]+)H198\.[0-9]+v-([0-9\.]+)h290\.1Z/g,
          'M488.85,$1v$2H56.15v-$2h432.7Z');
        tmpl = tmpl.replace(/M489\.[0-9]+,([0-9\.]+)H198\.[0-9]+v([0-9\.]+)h290\.6v-([0-9\.]+)h0Z/g,
          'M489.1,$1H55.9v$2h433.2v-$2h0Z');
        return tmpl;
      }

      let svgTemplatePromise = null;
      function loadSvgTemplate() {
        if (svgTemplateBaseWithMeaning && svgTemplateBaseWithoutMeaning) {
          return Promise.resolve(showMeaning ? svgTemplateBaseWithMeaning : svgTemplateBaseWithoutMeaning);
        }
        if (svgTemplatePromise) {
          return svgTemplatePromise;
        }
        svgTemplatePromise = (async () => {
          try {
            let text = '';
            if (window.AndroidBridge && typeof window.AndroidBridge.getSvgTemplate === 'function') {
              try {
                text = window.AndroidBridge.getSvgTemplate();
              } catch (bridgeErr) {
                console.warn('Bridge getSvgTemplate error', bridgeErr);
              }
            }
            if (!text) {
              const res = await fetch('quran_ortho_template.svg');
              text = await res.text();
            }
            if (text) {
              const endSvgIdx = text.lastIndexOf('</svg>');
              const rawBase = endSvgIdx !== -1 ? text.substring(0, endSvgIdx) : text;
              svgTemplateBaseWithMeaning = rawBase;
              svgTemplateBaseWithoutMeaning = createMushafTemplateNoMeaning(rawBase);
              svgTemplateBase = rawBase;
            }
          } catch (e) {
            console.error('Failed to fetch SVG template', e);
          } finally {
            svgTemplatePromise = null;
          }
          return showMeaning ? (svgTemplateBaseWithMeaning || svgTemplateBase) : (svgTemplateBaseWithoutMeaning || svgTemplateBase);
        })();
        return svgTemplatePromise;
      }

      // শুধুমাত্র মুসহাফ ভিউ মোড হলে ব্যাকগ্রাউন্ডে প্রি-লোড
      if (!isClassicMode) {
        loadSvgTemplate();
      }

      function buildMarginBookmarkDotsSvg(pageNum) {
        if (!activeBookmark || !activeBookmark.wordId) return '';
        const m = String(activeBookmark.wordId).match(/^p(\d+)_r(\d+)_/);
        if (!m) return '';
        const bmPage = parseInt(m[1], 10);
        const bmRow = parseInt(m[2], 10);
        if (bmPage !== pageNum) return '';

        const g = ROW_GEOMETRY[bmRow] || ROW_GEOMETRY[0];
        const cy = (g.ay + (g.ah / 2)).toFixed(2);
        return `
          <g class="kq-margin-bookmark-dot">
            <circle cx="502.5" cy="${cy}" r="8.2" fill="rgba(239, 68, 68, 0.22)" />
            <circle cx="502.5" cy="${cy}" r="5.2" fill="#EF4444" stroke="#B91C1C" stroke-width="0.9" />
            <circle cx="502.5" cy="${cy}" r="1.7" fill="#FFFFFF" />
          </g>
        `;
      }

      function renderMushafSvg(pageData) {
        if (!pageData) return;
        currentPageData = pageData;
        if (!pageData.rows) pageData.rows = [];
        const card = document.getElementById('mushafCard');
        if (!card) return;

        if (!svgTemplateBaseWithMeaning || !svgTemplateBaseWithoutMeaning) {
          loadSvgTemplate().then(() => {
            const dataToRender = currentPageData || pageData;
            if (dataToRender) {
              renderMushafSvg(dataToRender);
            }
          });
          return;
        }

        const activeTemplate = showMeaning ? svgTemplateBaseWithMeaning : svgTemplateBaseWithoutMeaning;

        // ১. হেডার প্লেট: সূরার নাম, পারা ও পৃষ্ঠা নং (উপরের অলঙ্কৃত ফ্রেমের ঠিক মাঝখানে)
        const headerX = "170";
        const headerW = "204";
        const headerTitle = pageData.header_center_title || pageData.surah_name_bn || pageData.surah_name_ar || '';
        let foContent = `
          <foreignObject x="${headerX}" y="83" width="${headerW}" height="22.5">
            <div xmlns="http://www.w3.org/1999/xhtml" class="kq-ortho-header-plate">
              <div class="kq-ortho-header-title">${headerTitle}</div>
              <div class="kq-ortho-header-sub">পারা ${toBanglaNum(pageData.juz)} • পৃষ্ঠা ${toBanglaNum(pageData.page)}</div>
            </div>
          </foreignObject>
        `;

        // ২. ৯টি রো
        const rows = pageData.rows || [];
        rows.forEach((r, idx) => {
          const g = ROW_GEOMETRY[idx] || ROW_GEOMETRY[0];

          // শব্দসমূহ <span class="kq-word">
          let wordsHtml = '';
          if (r.words && Array.isArray(r.words)) {
            r.words.forEach((w, wIdx) => {
              const wordId = `p${pageData.page}_r${idx}_w${wIdx}`;
              const markColor = wordMarks[wordId] || '';
              const markClass = markColor ? `marked-${markColor}` : '';
              const isBm = (activeBookmark && activeBookmark.wordId === wordId) ? 'bookmarked' : '';
              wordsHtml += `<span class="kq-word ${markClass} ${isBm}" data-word-id="${wordId}" data-word-text="${w}" data-ayah-ref="${r.ayah_ref || ''}" data-surah="${r.surah_name || ''}" data-meaning="${encodeURIComponent(r.meaning || '')}" data-translit="${encodeURIComponent(r.translit || '')}">${w}</span> `;
            });
          } else {
            wordsHtml = r.arabic || '';
          }

          if (showMeaning) {
            // ১. বাম পাশের অর্থ বক্স
            const mText = r.meaning || '';
            let meaningInlineStyle = '';
            if (mText.length > 78) {
              meaningInlineStyle = 'font-size: 8.2px; line-height: 1.18;';
            } else if (mText.length > 58) {
              meaningInlineStyle = 'font-size: 8.6px; line-height: 1.25;';
            }

            foContent += `
              <foreignObject x="56.15" y="${g.ly}" width="142.64" height="${g.lh}">
                <div xmlns="http://www.w3.org/1999/xhtml" class="kq-ortho-meaning-box">
                  <div class="kq-ortho-meaning-text" style="${meaningInlineStyle}">${mText}</div>
                </div>
              </foreignObject>
            `;

            // ২. ডান পাশের আরবি বক্স (AASaddamQuran)
            foContent += `
              <foreignObject x="198.62" y="${g.sy}" width="290.35" height="61.88" style="overflow:visible;">
                <div xmlns="http://www.w3.org/1999/xhtml" class="kq-ortho-arabic-box" id="orthoLine_${idx}">
                  ${wordsHtml}
                </div>
              </foreignObject>
            `;
          } else {
            // বাংলা অর্থ লুকানো থাকলে: সম্পূর্ণ পেজ জুড়ে আরবি বক্স (প্রস্থ ৪৩২.৮২)
            foContent += `
              <foreignObject x="56.15" y="${g.sy}" width="432.82" height="61.88" style="overflow:visible;">
                <div xmlns="http://www.w3.org/1999/xhtml" class="kq-ortho-arabic-box full-width" id="orthoLine_${idx}">
                  ${wordsHtml}
                </div>
              </foreignObject>
            `;
          }
        });

        // ৩. মার্জিন বুকমার্ক ডট
                // ৩. সাংকেতিক চিহ্নের লাইনের নিচের স্পষ্ট ডিভাইডার দাগ ও পৃথক খোপ (Tajweed Strip Divider)
        let tajweedDividersSvg = '';
        rows.forEach((r, idx) => {
          const g = ROW_GEOMETRY[idx] || ROW_GEOMETRY[0];
          const lineX1 = showMeaning ? 198.62 : 56.15;
          const lineX2 = 488.97;
          const divY = (g.sy + g.sh).toFixed(2);
          tajweedDividersSvg += `<line x1="${lineX1}" y1="${divY}" x2="${lineX2}" y2="${divY}" class="kq-tajweed-strip-divider" />`;
        });

        // ৪. মার্জিন বুকমার্ক ডট
        const marginDotsSvg = `<g id="kqBookmarkMarginDots">${buildMarginBookmarkDotsSvg(pageData.page)}</g>`;
        const fullSvg = `${activeTemplate}<g id="kqDynamicQuranPage">${foContent}${tajweedDividersSvg}${marginDotsSvg}</g></svg>`;

        card.innerHTML = fullSvg;
        const svgEl = card.querySelector('svg');
        if (svgEl) {
          svgEl.removeAttribute('width');
          svgEl.removeAttribute('height');
          svgEl.style.width = '100%';
          svgEl.style.height = '100%';
          svgEl.style.display = 'block';
          applyMushafSvgFit(svgEl);
        }
        // লম্বা আরবি লাইনের বাম/ডান প্রান্ত যেন কখনোই বর্ডার না ছোঁয় (অটো-ফিট)
        requestAnimationFrame(() => {
          card.querySelectorAll('.kq-ortho-arabic-box').forEach(box => {
            if (box.scrollWidth > box.clientWidth + 2) {
              const ratio = Math.max(0.82, (box.clientWidth - 4) / box.scrollWidth);
              const computed = parseFloat(window.getComputedStyle(box).fontSize) || 22.8;
              box.style.setProperty('font-size', (computed * ratio).toFixed(2) + 'px', 'important');
            }
          });
        });
        attachWordClickHandlers();
        hideKqLoader();
        notifyBridgeReadyOnce();
      }

      function attachWordClickHandlers() {
        document.querySelectorAll('.kq-word').forEach(el => {
          el.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isDragging) return;
            openWordPopover(el);
          });
        });
      }

      function analyzeTajweed(word) {
        const rules = [];
        if (/[\u08E4]/.test(word)) {
          rules.push({ name: 'মাদ্দে আসলী (১ আলিফ টান)', symbol: '১', color: '#10B981', desc: '১ আলিফ টেনে পড়তে হবে' });
        }
        if (/[\u06E2\u06E3]/.test(word)) {
          rules.push({ name: 'মাদ্দে মুত্তাছিল (৪ আলিফ)', symbol: '৪', color: '#EC4899', desc: '৪ আলিফ টেনে পড়তে হবে' });
        }
        if (/[نّمّ]/.test(word)) {
          rules.push({ name: 'ওয়াজিব গুন্নাহ', symbol: 'গু', color: '#E11D48', desc: 'নাক দিয়ে গুন্নাহ করে পড়া ওয়াজিব' });
        }
        if (/[قطبدج]/.test(word) && /[\u0652]/.test(word)) {
          rules.push({ name: 'ক্বলক্বলাহ (প্রতিধ্বনি)', symbol: 'ক্ব', color: '#0284C7', desc: 'প্রতিধ্বনি করে পড়তে হবে' });
        }
        if (/[\u06D6-\u06DC]/.test(word)) {
          rules.push({ name: 'ওয়াক্ফ নিদর্শন', symbol: 'ওয়', color: '#8B5CF6', desc: 'থামার বা মিলিয়ে পড়ার নিয়ম' });
        }
        return rules;
      }

      function openWordPopover(wordEl) {
        selectedWordEl = wordEl;
        const popover = document.getElementById('kqWordPopover');
        if (!popover) return;

        const rawWord = wordEl.dataset.wordText || wordEl.textContent.trim();
        const translit = decodeURIComponent(wordEl.dataset.translit || '');
        const meaning = decodeURIComponent(wordEl.dataset.meaning || '');
        const ayahRef = wordEl.dataset.ayahRef || '';
        const surah = wordEl.dataset.surah || '';
        const wordId = wordEl.dataset.wordId || '';

        // অ্যান্ড্রয়েড নেটিভ লেয়ারে রিপোর্ট (অ্যান্ড্রয়েডে নেটিভ বটম শিট ব্যবহার হবে)
        if (window.AndroidBridge && window.AndroidBridge.onWordClicked) {
          try {
            window.AndroidBridge.onWordClicked(wordId, rawWord, translit, meaning, ayahRef, surah);
          } catch (e) {}
          return;
        }

        const tajweed = analyzeTajweed(rawWord);
        let tajweedHtml = '';
        if (tajweed.length > 0) {
          tajweedHtml = tajweed.map(t => `
            <span class="kq-popover-tajweed-badge" style="border-color:${t.color}; color:${t.color};">
              <strong>${t.symbol}</strong> ${t.name}
            </span>
          `).join(' ');
        } else {
          tajweedHtml = `<span style="font-size:11px; color:#94A3B8;">সাধারণ তিলাওয়াত নিয়ম</span>`;
        }

        const isBookmarked = wordEl.classList.contains('bookmarked');
        const bmIcon = isBookmarked
          ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:3px;"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>'
          : '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;margin-right:3px;"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z"/></svg>';
        const bmLabel = bmIcon + (isBookmarked ? 'চিহ্নিত বাতিল' : 'শব্দ বুকমার্ক');

        // সূরা ও আয়াত নম্বর এবং শব্দের ইনডেক্স বের করা
        const surahMatch = String(ayahRef).match(/^(\d+):(\d+)/);
        const sNum = surahMatch ? parseInt(surahMatch[1], 10) : 1;
        const aNum = surahMatch ? parseInt(surahMatch[2], 10) : 1;
        const wMatch = String(wordId).match(/_w(\d+)$/);
        const wIdx = wMatch ? (parseInt(wMatch[1], 10) + 1) : 1;

        // শব্দে ক্লিক করার সাথে সাথে অডিও উচ্চারণ প্লে করা
        if (window.AndroidBridge && window.AndroidBridge.onPlayWordAudio) {
          try {
            window.AndroidBridge.onPlayWordAudio(sNum, aNum, wIdx, wordId);
          } catch (e) {}
        }

        popover.innerHTML = `
          <div style="display:flex; align-items:center; justify-content:space-between; width:100%; margin-bottom:6px;">
            <div class="kq-popover-word-title" style="margin:0;">${rawWord}</div>
            <div style="display:inline-flex; align-items:center; gap:6px;">
              <button type="button" class="kq-popover-audio-btn" id="btnPopoverWordAudio" title="শব্দের বিশুদ্ধ উচ্চারণ শুনুন">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg> শব্দ
              </button>
              <button type="button" class="kq-popover-audio-btn" id="btnPopoverAyahAudio" style="background:linear-gradient(135deg, #B45309, #78350F);" title="সম্পূর্ণ আয়াতের তিলাওয়াত শুনুন">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:middle;"><path d="M8 5v14l11-7z"/></svg> আয়াত
              </button>
            </div>
          </div>
          <div class="kq-popover-meta">
            ${translit ? `<div><strong>উচ্চারণ:</strong> ${translit}</div>` : ''}
            ${meaning ? `<div><strong>অর্থ:</strong> ${meaning}</div>` : ''}
            ${ayahRef ? `<div><strong>আয়াত:</strong> ${ayahRef} ${surah ? `(${surah})` : ''}</div>` : ''}
          </div>
          <div style="padding-top:4px; display:flex; flex-wrap:wrap; gap:4px;">
            ${tajweedHtml}
          </div>
          <div class="kq-popover-actions">
            <button type="button" class="kq-popover-btn" id="btnPopoverBookmark">${bmLabel}</button>
            <div class="kq-popover-colors">
              <span class="kq-color-dot dot-yellow" data-color="yellow" title="হলুদ"></span>
              <span class="kq-color-dot dot-green"  data-color="green"  title="সবুজ"></span>
              <span class="kq-color-dot dot-blue"   data-color="blue"   title="নীল"></span>
              <span class="kq-color-dot dot-coral"  data-color="coral"  title="লাল"></span>
              <span class="kq-color-dot dot-clear"  data-color="clear"  title="মুছুন"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></span>
            </div>
          </div>
        `;

        document.getElementById('btnPopoverBookmark').onclick = () => {
          toggleBookmarkSelectedWord();
        };

        const btnAudio = document.getElementById('btnPopoverWordAudio');
        if (btnAudio) {
          btnAudio.onclick = (e) => {
            e.stopPropagation();
            if (window.AndroidBridge && window.AndroidBridge.onPlayWordAudio) {
              try {
                window.AndroidBridge.onPlayWordAudio(sNum, aNum, wIdx, wordId);
              } catch (err) {}
            }
          };
        }

        const btnAyahAudio = document.getElementById('btnPopoverAyahAudio');
        if (btnAyahAudio) {
          btnAyahAudio.onclick = (e) => {
            e.stopPropagation();
            if (window.AndroidBridge && window.AndroidBridge.onPlayAyahAudio) {
              try {
                window.AndroidBridge.onPlayAyahAudio(sNum, aNum, surah);
              } catch (err) {}
            }
          };
        }

        popover.querySelectorAll('.kq-color-dot').forEach(dot => {
          dot.onclick = () => {
            const c = dot.dataset.color;
            markSelectedWord(c);
          };
        });

        // পপওভার পজিশনিং
        const rect = wordEl.getBoundingClientRect();
        popover.style.display = 'flex';
        let top = rect.bottom + 8;
        if (top + 220 > window.innerHeight) {
          top = Math.max(10, rect.top - 210);
        }
        let left = rect.left - 50;
        if (left < 10) left = 10;
        if (left + 280 > window.innerWidth) left = window.innerWidth - 290;

        popover.style.top = top + 'px';
        popover.style.left = left + 'px';
      }

      function markSelectedWord(color) {
        if (!selectedWordEl) return;
        const wordId = selectedWordEl.dataset.wordId;
        if (!wordId) return;

        selectedWordEl.classList.remove('marked-yellow', 'marked-green', 'marked-blue', 'marked-coral');
        if (color === 'clear') {
          delete wordMarks[wordId];
        } else {
          selectedWordEl.classList.add(`marked-${color}`);
          wordMarks[wordId] = color;
        }

        const popover = document.getElementById('kqWordPopover');
        if (popover) popover.style.display = 'none';

        if (window.AndroidBridge && window.AndroidBridge.onWordMarked) {
          try {
            window.AndroidBridge.onWordMarked(wordId, color);
          } catch (e) {}
        }
      }

      function toggleBookmarkSelectedWord() {
        if (!selectedWordEl) return;
        const wordId = selectedWordEl.dataset.wordId;
        const rawWord = selectedWordEl.dataset.wordText || '';
        const pageNum = currentPageData ? currentPageData.page : 1;

        if (activeBookmark && activeBookmark.wordId === wordId) {
          selectedWordEl.classList.remove('bookmarked');
          activeBookmark = null;
        } else {
          document.querySelectorAll('.kq-word.bookmarked').forEach(el => el.classList.remove('bookmarked'));
          selectedWordEl.classList.add('bookmarked');
          activeBookmark = { wordId, wordText: rawWord, page: pageNum };
        }

        const grp = document.getElementById('kqBookmarkMarginDots');
        if (grp) grp.innerHTML = buildMarginBookmarkDotsSvg(pageNum);

        const popover = document.getElementById('kqWordPopover');
        if (popover) popover.style.display = 'none';

        if (window.AndroidBridge && window.AndroidBridge.onBookmarkSet) {
          try {
            window.AndroidBridge.onBookmarkSet(wordId, pageNum, !!activeBookmark);
          } catch (e) {}
        }
      }

      // ========================================================
      // উন্নত ২ডি জুম, প্যান এবং পিঞ্চ-টু-জুম ইঞ্জিন
      // (Smooth Pinch-to-Zoom, 2D Pan, Double-Tap & Edge Bounding)
      // ========================================================
      let currentScale = 1.0;
      let panX = 0;
      let panY = 0;
      let isPinching = false;
      let pinchStartDistance = 0;
      let pinchStartScale = 1.0;
      // NOTE: touchStartX/touchStartY/touchMoved/lastTapTime/tapDebounceTimer
      // ইতিমধ্যে উপরের "টাচ / সোয়াইপ হ্যান্ডলিং" ব্লকে একই স্কোপে ঘোষিত —
      // এখানে পুনরায় let করা হলে SyntaxError হবে (window.KQApp তৈরি হবে না)।
      let lastTouchX = 0;
      let lastTouchY = 0;

      function updateCardTransform(withAnimation) {
        const card = document.getElementById('mushafCard');
        const wrap = document.getElementById('mushafScrollWrap');
        if (!card || !wrap) return;

        const wrapRect = wrap.getBoundingClientRect();
        const wrapW = wrapRect.width || window.innerWidth;
        const wrapH = wrapRect.height || window.innerHeight;

        if (currentScale <= 1.02) {
          currentScale = 1.0;
          panX = 0;
          panY = 0;
          wrap.classList.add('is-fit-page');
          if (window.AndroidBridge && window.AndroidBridge.setZoomed) {
            try { window.AndroidBridge.setZoomed(false); } catch (e) {}
          }
        } else {
          wrap.classList.remove('is-fit-page');
          // বাউন্ডারি ক্ল্যাম্পিং: পৃষ্ঠা যেন ভিউপোর্টের বাইরে হারিয়ে না যায়
          const maxPanX = Math.max(0, (wrapW * (currentScale - 1)) / 2);
          const maxPanY = Math.max(0, (wrapH * (currentScale - 1)) / 2);

          panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
          panY = Math.max(-maxPanY, Math.min(maxPanY, panY));

          if (window.AndroidBridge && window.AndroidBridge.setZoomed) {
            try { window.AndroidBridge.setZoomed(true); } catch (e) {}
          }
        }

        pageZoom = Math.round(currentScale * 100);
        card.style.transition = withAnimation ? 'transform 0.28s cubic-bezier(0.2, 0, 0, 1)' : 'none';
        card.style.transformOrigin = 'center center';
        card.style.transform = `translate3d(${panX.toFixed(2)}px, ${panY.toFixed(2)}px, 0px) scale(${currentScale.toFixed(3)})`;
      }

      function applyZoom(zoom, withAnimation = true) {
        const z = Math.max(100, Math.min(350, zoom || 100));
        currentScale = z / 100;
        if (currentScale <= 1.02) {
          currentScale = 1.0;
          panX = 0;
          panY = 0;
        }
        updateCardTransform(withAnimation);
      }

      const wrap = document.getElementById('mushafScrollWrap');

      // ১. টাচ স্টার্ট (পিঞ্চ ডিটেকশন ও প্যান ইনিশিয়ালাইজেশন)
      wrap.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          isPinching = true;
          pinchStartDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          pinchStartScale = currentScale;
          if (window.AndroidBridge && window.AndroidBridge.setZoomed) {
            try { window.AndroidBridge.setZoomed(true); } catch (err) {}
          }
        } else if (e.touches.length === 1) {
          isPinching = false;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          lastTouchX = touchStartX;
          lastTouchY = touchStartY;
          touchMoved = false;
        }
      }, { passive: false });

      // ২. টাচ মুভ (স্মুথ ২ডি প্যানিং এবং লাইভ পিঞ্চ স্কেলিং)
      wrap.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && isPinching) {
          e.preventDefault();
          const curDist = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          if (pinchStartDistance > 0) {
            const factor = curDist / pinchStartDistance;
            currentScale = Math.max(1.0, Math.min(3.5, pinchStartScale * factor));
            updateCardTransform(false);
          }
        } else if (e.touches.length === 1) {
          const curX = e.touches[0].clientX;
          const curY = e.touches[0].clientY;
          const dx = curX - lastTouchX;
          const dy = curY - lastTouchY;
          lastTouchX = curX;
          lastTouchY = curY;

          if (Math.hypot(curX - touchStartX, curY - touchStartY) > 6) {
            touchMoved = true;
            const popover = document.getElementById('kqWordPopover');
            if (popover) popover.style.display = 'none';
          }

          // যদি জুম করা থাকে, তাহলে স্বাধীনভাবে উপরে-নিচে ও ডানে-বামে ২ডি প্যান হবে
          if (currentScale > 1.02) {
            e.preventDefault();
            panX += dx;
            panY += dy;
            updateCardTransform(false);
          }
        }
      }, { passive: false });

      // ৩. টাচ এন্ড (ডাবল-ট্যাপ জুম, সিঙ্গেল-ট্যাপ ফুলস্ক্রিন ও বাউন্ডারি স্ন্যাপিং)
      wrap.addEventListener('touchend', (e) => {
        if (isPinching && e.touches.length < 2) {
          isPinching = false;
          if (currentScale < 1.08) {
            currentScale = 1.0;
            panX = 0;
            panY = 0;
          }
          updateCardTransform(true);
          return;
        }

        if (e.touches.length === 0) {
          if (currentScale > 1.02) {
            updateCardTransform(true);
          }

          if (!touchMoved) {
            const now = Date.now();
            const target = e.target;
            const isWord = target && target.closest('.kq-word');
            const popover = document.getElementById('kqWordPopover');

            if (!isWord) {
              if (popover && popover.style.display !== 'none') {
                popover.style.display = 'none';
              } else {
                // ডাবল ট্যাপ চেক
                if (now - lastTapTime < 280) {
                  if (tapDebounceTimer) {
                    clearTimeout(tapDebounceTimer);
                    tapDebounceTimer = null;
                  }
                  // ডাবল ট্যাপ = ১.০x এবং ২.০x এর মধ্যে টগল
                  if (currentScale > 1.15) {
                    currentScale = 1.0;
                    panX = 0;
                    panY = 0;
                  } else {
                    currentScale = 2.0;
                    const wrapRect = wrap.getBoundingClientRect();
                    panX = (wrapRect.width / 2 - lastTouchX) * 0.7;
                    panY = (wrapRect.height / 2 - lastTouchY) * 0.7;
                  }
                  updateCardTransform(true);
                } else {
                  // সিঙ্গেল ট্যাপ = ফুলস্ক্রিন / ইমার্সিভ টপ বার টগল
                  if (tapDebounceTimer) clearTimeout(tapDebounceTimer);
                  tapDebounceTimer = setTimeout(() => {
                    if (window.AndroidBridge && window.AndroidBridge.onToggleImmersive) {
                      try { window.AndroidBridge.onToggleImmersive(); } catch (err) {}
                    }
                    tapDebounceTimer = null;
                  }, 280);
                }
                lastTapTime = now;
              }
            }
          }
        }
      });

      // ক্লিক আউটসাইড পপওভার হাইড
      document.addEventListener('click', (e) => {
        const popover = document.getElementById('kqWordPopover');
        if (popover && !popover.contains(e.target) && !e.target.closest('.kq-word')) {
          popover.style.display = 'none';
        }
      });

      const classicSvgCache = {};

      // ক্লাসিক মোডে প্রতিটি শব্দের ওপর অদৃশ্য কিন্তু স্পর্শযোগ্য টাচ ওভারলে তৈরি
      function attachClassicWordOverlay(card, pageData) {
        const svgEl = card.querySelector('svg');
        if (!svgEl || !pageData || !pageData.rows) return;

        let existing = svgEl.querySelector('#kqClassicTouchOverlay');
        if (existing) existing.remove();

        const overlayGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        overlayGroup.setAttribute('id', 'kqClassicTouchOverlay');

        const rows = pageData.rows || [];
        rows.forEach((r, idx) => {
          const g = ROW_GEOMETRY[idx] || ROW_GEOMETRY[0];
          const words = r.words || [];
          if (words.length === 0) return;

          const startX = showMeaning ? 198.62 : 88.0;
          const endX = 490.0;
          const rowW = endX - startX;
          const wordW = rowW / words.length;

          words.forEach((w, wIdx) => {
            // RTL সাজানো: প্রথম শব্দ একদম ডানে
            const x = endX - (wIdx + 1) * wordW;
            const y = g.sy;
            const h = 61.88;

            const wordId = `p${pageData.page}_r${idx}_w${wIdx}`;
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', x.toFixed(2));
            rect.setAttribute('y', y.toFixed(2));
            rect.setAttribute('width', wordW.toFixed(2));
            rect.setAttribute('height', h.toFixed(2));
            rect.setAttribute('class', 'kq-classic-word-touch kq-word');
            rect.setAttribute('data-word-id', wordId);
            rect.setAttribute('data-word-text', w);
            rect.setAttribute('data-ayah-ref', r.ayah_ref || '');
            rect.setAttribute('data-surah', r.surah_name || '');
            rect.setAttribute('data-meaning', encodeURIComponent(r.meaning || ''));
            rect.setAttribute('data-translit', encodeURIComponent(r.translit || ''));

            rect.addEventListener('click', (e) => {
              e.stopPropagation();
              if (isDragging) return;
              openWordPopover(rect);
            });

            overlayGroup.appendChild(rect);
          });
        });

        svgEl.appendChild(overlayGroup);
      }

      async function renderClassicPage(pageNum) {
        // ভূমিকা পৃষ্ঠা ১-১০ বাদ দিয়ে ন্যূনতম পৃষ্ঠা ১১ (ফাতিহা/কভার) থেকে শুরু
        const targetPage = Math.max(1, pageNum || 1);
        const card = document.getElementById('mushafCard');
        if (!card) return;

        const existingSvg = card.querySelector('svg');
        if (currentClassicPage === targetPage && existingSvg && card.dataset.renderedClassic === String(targetPage)) {
          existingSvg.classList.toggle('kq-hide-meaning', !showMeaning);
          card.classList.toggle('kq-hide-meaning', !showMeaning);
          document.body.classList.toggle('kq-classic-hide-meaning', !showMeaning);
          return;
        }

        currentClassicPage = targetPage;
        card.dataset.renderedClassic = String(targetPage);

        const pStr = String(currentClassicPage).padStart(3, '0');
        const url = `classic_pages/p_${pStr}.svg`;
        let svgText = classicSvgCache[currentClassicPage];
        if (!svgText) {
          if (window.AndroidBridge && typeof window.AndroidBridge.getClassicSvg === 'function') {
            try {
              svgText = window.AndroidBridge.getClassicSvg(currentClassicPage);
              if (svgText) {
                classicSvgCache[currentClassicPage] = svgText;
              }
            } catch (err) {
              console.warn('Bridge getClassicSvg error:', err);
            }
          }
          if (!svgText) {
            try {
              const res = await fetch(url);
              if (res.ok) {
                svgText = await res.text();
                classicSvgCache[currentClassicPage] = svgText;
              }
            } catch (e) {
              console.warn('Classic SVG fetch error:', e);
            }
          }
        }

        if (svgText) {
          card.innerHTML = svgText;
          const svgEl = card.querySelector('svg');
          if (svgEl) {
            svgEl.classList.add('kq-classic-vector-svg');
            svgEl.classList.add(`kq-theme-${currentTheme}`);
            svgEl.classList.toggle('kq-hide-meaning', !showMeaning);
            svgEl.removeAttribute('width');
            svgEl.removeAttribute('height');
            svgEl.style.width = '100%';
            svgEl.style.height = '100%';
            svgEl.style.display = 'block';

            if (cropMargins !== false) {
              svgEl.setAttribute('viewBox', '86 108 426 620');
              svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            } else {
              svgEl.setAttribute('viewBox', '0 0 595.276 841.89');
              svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
            }
          }
          card.classList.toggle('kq-hide-meaning', !showMeaning);
          document.body.classList.toggle('kq-classic-hide-meaning', !showMeaning);
          document.body.classList.add('classic-mode');

          if (currentPageData && currentPageData.rows && currentPageData.rows.length > 0) {
            attachClassicWordOverlay(card, currentPageData);
          }

          prefetchAdjacentClassic(currentClassicPage);
          hideKqLoader();
          notifyBridgeReadyOnce();
        } else {
          // ক্লাসিক মোডে মূল ছাপা এসভিজি না পাওয়া গেলে কখনোই নতুন ভেক্টর মোডে পরিবর্তন করা যাবে না
          hideKqLoader();
          card.innerHTML = `
            <div style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; box-sizing:border-box;">
              <div style="width:100%; max-width:340px; background:rgba(212,175,55,0.06); border:1.2px dashed rgba(212,175,55,0.45); border-radius:18px; padding:24px 16px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px;">
                <div style="width:48px; height:48px; border-radius:50%; background:rgba(212,175,55,0.15); display:flex; align-items:center; justify-content:center; color:#D4AF37;">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
                </div>
                <div style="font-family:'Kalpurush',sans-serif; font-size:15px; font-weight:bold; color:var(--ortho-arabic-color, #D4AF37);">
                  জনপ্রিয় মুদ্রিত সংস্করণ (পৃষ্ঠা ${toBanglaNum(currentClassicPage)})
                </div>
                <div style="font-family:'Kalpurush',sans-serif; font-size:12px; color:#94A3B8; line-height:1.5;">
                  এই পৃষ্ঠার মূল মুদ্রিত সংস্করণ লোড হচ্ছে। আপনি অফলাইনে থাকলে ইন্টারনেট সংযোগ চালু করুন অথবা ডাউনলোড ম্যানেজার থেকে এই পারা ডাউনলোড করুন।
                </div>
                <button onclick="if(window.KQApp&&window.KQApp.loadFromBridge) window.KQApp.loadFromBridge();" style="margin-top:6px; background:#0F6B56; color:#FFFFFF; border:1px solid #D4AF37; border-radius:10px; padding:7px 18px; font-family:'Kalpurush',sans-serif; font-size:12px; font-weight:bold; cursor:pointer; display:inline-flex; align-items:center; gap:6px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg> পুনরায় চেষ্টা করুন
                </button>
              </div>
            </div>
          `;
          notifyBridgeReadyOnce();
        }
      }

      function prefetchAdjacentClassic(p) {
        const nextP = p + 1;
        if (nextP <= 44 && !classicSvgCache[nextP]) {
          setTimeout(() => {
            fetch(`classic_pages/p_${String(nextP).padStart(3, '0')}.svg`)
              .then(r => r.ok ? r.text() : null)
              .then(t => {
                if (t) {
                  classicSvgCache[nextP] = t;
                }
              })
              .catch(() => {});
          }, 350);
        }
      }

      let bridgeReadyNotified = false;
      function notifyBridgeReadyOnce() {
        if (bridgeReadyNotified) return;
        bridgeReadyNotified = true;
        if (window.AndroidBridge && typeof window.AndroidBridge.onReady === 'function') {
          try { window.AndroidBridge.onReady(); } catch (e) {}
        }
      }

      function isDarkColorHex(hex) {
        if (!hex || typeof hex !== 'string') return false;
        const clean = hex.replace('#', '').trim();
        if (clean.length !== 6) return false;
        const r = parseInt(clean.substring(0, 2), 16) || 0;
        const g = parseInt(clean.substring(2, 4), 16) || 0;
        const b = parseInt(clean.substring(4, 6), 16) || 0;
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        return lum < 0.45;
      }

      // গ্লোবাল অ্যান্ড্রয়েড ব্রিজ অবজেক্ট (Kotlin থেকে কল করার জন্য)
      window.KQApp = {
        setZoom: function(percent) {
          applyZoom(percent, true);
        },
        resetZoom: function() {
          applyZoom(100, true);
        },
        loadFromBridge: function () {
          if (window.AndroidBridge && typeof window.AndroidBridge.getInitConfig === 'function') {
            try {
              const cfgStr = window.AndroidBridge.getInitConfig();
              if (cfgStr) {
                const cfg = JSON.parse(cfgStr);
                if (typeof cfg.isClassic === 'boolean') isClassicMode = cfg.isClassic;
                if (cfg.pageNum) currentClassicPage = cfg.pageNum;
                if (typeof cfg.cropMargins === 'boolean') cropMargins = cfg.cropMargins;
                if (typeof cfg.showMeaning === 'boolean') showMeaning = cfg.showMeaning;
                const cAr = cfg.customAr || cfg.customArabic || null;
                const cBn = cfg.customBn || cfg.customBangla || null;
                if (cfg.themeId) this.setTheme(cfg.themeId, cfg.customBg || null, cAr, cBn);
                if (cfg.arabicScale || cfg.banglaScale) this.setFontScale(cfg.arabicScale, cfg.banglaScale);
                if (cfg.wordMarks) wordMarks = cfg.wordMarks;
                if (cfg.activeBookmark !== undefined) activeBookmark = cfg.activeBookmark;
              }
            } catch (e) {}
          }
          if (isClassicMode) {
            renderClassicPage(currentClassicPage);
            return;
          }
          if (window.AndroidBridge && typeof window.AndroidBridge.getPageJson === 'function') {
            try {
              const raw = window.AndroidBridge.getPageJson();
              if (raw && raw.length > 5) {
                this.setPageData(raw);
              }
            } catch (err) {
              console.error('loadFromBridge error', err);
            }
          }
        },

        setPageData: function (jsonStr) {
          try {
            const data = (typeof jsonStr === 'string') ? JSON.parse(jsonStr) : jsonStr;
            currentPageData = data;
            if (isClassicMode) {
              renderClassicPage(data.page);
            } else {
              renderMushafSvg(data);
            }
          } catch (e) {
            console.error('Failed to parse page json', e);
          }
        },

        setBengaliMeaning: function (show) {
          const nextShow = (show !== false);
          const changed = (nextShow !== showMeaning);
          showMeaning = nextShow;
          const card = document.getElementById('mushafCard');
          if (card) {
            card.classList.toggle('kq-hide-meaning', !showMeaning);
            const svgEl = card.querySelector('svg');
            if (svgEl) {
              svgEl.classList.toggle('kq-hide-meaning', !showMeaning);
            }
          }
          document.body.classList.toggle('kq-classic-hide-meaning', !showMeaning);
          if (changed && !isClassicMode && currentPageData) {
            renderMushafSvg(currentPageData);
          }
        },

        setCropMargins: function (crop) {
          cropMargins = !!crop;
          const card = document.getElementById('mushafCard');
          if (card) {
            const svgEl = card.querySelector('svg');
            if (svgEl) {
              applyMushafSvgFit(svgEl);
            }
          }
        },

        setFontScale: function (arScale, bnScale) {
          const root = document.documentElement;
          if (arScale) root.style.setProperty('--arabic-font-scale', String(arScale));
          if (bnScale) root.style.setProperty('--bangla-font-scale', String(bnScale));
        },

        setClassicMode: function (isClassic, pageNum) {
          const nextClassic = !!isClassic;
          if (nextClassic !== isClassicMode) {
            const card = document.getElementById('mushafCard');
            if (card) card.innerHTML = '';
          }
          isClassicMode = nextClassic;
          if (isClassicMode) {
            document.body.classList.add('classic-mode');
            const p = pageNum || (currentPageData ? currentPageData.page : 1);
            renderClassicPage(p);
          } else {
            document.body.classList.remove('classic-mode');
            if (currentPageData) {
              renderMushafSvg(currentPageData);
            }
          }
        },

        setTheme: function (themeId, customBg, customAr, customBn) {
          currentTheme = themeId || 'light';
          document.documentElement.dataset.theme = currentTheme;
          document.body.dataset.theme = currentTheme;
          document.body.classList.remove('kq-theme-dark', 'kq-theme-light', 'kq-theme-sepia', 'kq-theme-emerald', 'kq-theme-midnight', 'kq-theme-cream');
          document.body.classList.add(`kq-theme-${currentTheme}`);

          const def = THEME_ORTHO_DEFAULTS[currentTheme] || THEME_ORTHO_DEFAULTS.light;
          const root = document.documentElement;
          const arCol = customAr || def.arabic;
          const bnCol = customBn || def.meaning;
          const hasTrueCustomBg = !!(customBg && String(customBg).trim() !== '' && String(customBg).toLowerCase() !== String(def.bg).toLowerCase());
          const bgCol = hasTrueCustomBg ? customBg : def.bg;

          root.style.setProperty('--classic-arabic-color', arCol);
          root.style.setProperty('--classic-trans-color', bnCol);
          root.style.setProperty('--classic-tajweed-color', '#FDE68A');
          root.style.setProperty('--classic-notes-color', '#D97706');

          const _c = document.getElementById('mushafCard');
          if (_c) {
            const _s = _c.querySelector('svg');
            if (_s) {
              _s.classList.remove('kq-theme-dark', 'kq-theme-light', 'kq-theme-sepia', 'kq-theme-emerald', 'kq-theme-midnight', 'kq-theme-cream');
              _s.classList.add(`kq-theme-${currentTheme}`);
            }
          }

          root.style.setProperty('--ortho-arabic-color', arCol);
          root.style.setProperty('--ortho-trans-color', bnCol);
          root.style.setProperty('--bg-body', bgCol);
          root.style.setProperty('--classic-card-bg', bgCol);

          if (hasTrueCustomBg) {
            const darkCustom = isDarkColorHex(customBg);
            document.body.classList.add('has-custom-page-bg');
            root.style.setProperty('--custom-page-bg', customBg);
            root.style.setProperty('--custom-page-frame-bg', customBg);
            root.style.setProperty('--custom-arabic-row-bg', customBg);
            root.style.setProperty('--custom-tajweed-strip-bg', darkCustom ? '#182C3C' : '#C2EBD5');
            root.style.setProperty('--custom-meaning-odd-bg', darkCustom ? '#162234' : '#FFF9C5');
            root.style.setProperty('--custom-meaning-even-bg', darkCustom ? '#201B32' : '#F8C8DC');
            root.style.setProperty('--custom-grid-line-color', darkCustom ? '#10B981' : '#006838');
            root.style.setProperty('--custom-header-title-color', darkCustom ? '#FDE68A' : '#B91C1C');
            root.style.setProperty('--custom-header-sub-color', darkCustom ? '#6EE7B7' : '#006838');
          } else {
            document.body.classList.remove('has-custom-page-bg');
          }
        },

        setWordMarks: function (marksJson) {
          try {
            wordMarks = (typeof marksJson === 'string') ? JSON.parse(marksJson) : (marksJson || {});
            if (currentPageData && !isClassicMode) renderMushafSvg(currentPageData);
          } catch (e) {}
        },

        setActiveBookmark: function (bmJson) {
          try {
            activeBookmark = (typeof bmJson === 'string') ? JSON.parse(bmJson) : bmJson;
            if (currentPageData && !isClassicMode) {
              const grp = document.getElementById('kqBookmarkMarginDots');
              if (grp) grp.innerHTML = buildMarginBookmarkDotsSvg(currentPageData.page);
            }
          } catch (e) {}
        },

        zoomIn: function () { applyZoom(pageZoom + 25); },
        zoomOut: function () { applyZoom(pageZoom - 25); },
        fitToPage: function () { applyZoom(100); }
      };

      // তাৎক্ষণিক কনফিগ সিঙ্ক ও পেজ লোড (রেন্ডার শেষ হলে notifyBridgeReadyOnce কল হবে)
      if (isClassicMode) {
        window.KQApp.loadFromBridge();
      } else {
        loadSvgTemplate().then(() => {
          if (window.KQApp && typeof window.KQApp.loadFromBridge === 'function') {
            window.KQApp.loadFromBridge();
          }
        });
      }

      // সেফটি ফলব্যাক (যদি কোনো কারণে ব্রিজ ডেটা দেরিতে আসে)
      setTimeout(() => {
        notifyBridgeReadyOnce();
      }, 1800);
    })();
  </script>
</body>
</html>
